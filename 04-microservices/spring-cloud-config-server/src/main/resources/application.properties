spring.application.name=spring-cloud-config-server
server.port=8888

# Serve config straight from the sibling folder (no nested git repo needed).
# Path is relative to where you start the server: run it from 04-microservices/spring-cloud-config-server.
spring.profiles.active=native
spring.cloud.config.server.native.search-locations=file:../git-local-config-repo
