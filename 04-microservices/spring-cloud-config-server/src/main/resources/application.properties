spring.application.name=spring-cloud-config-server
server.port=8888

# "native" backend: serve plain files from a folder - no git repository needed.
# The default path is relative to where the server starts, so start it from this folder
# (./mvnw spring-boot:run, the start-all script, or the IDE with this folder as working dir).
# Override it with an absolute path:  CONFIG_REPO=file:/path/to/config-files
spring.profiles.active=native
spring.cloud.config.server.native.search-locations=${CONFIG_REPO:file:../git-local-config-repo}
