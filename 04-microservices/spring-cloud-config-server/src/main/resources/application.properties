spring.application.name=spring-cloud-config-server
server.port=8888

# The config server = ONE central place that keeps the settings of every service.
# Like a school notice board: every class reads its timetable from the same board.
# "native" backend: serve plain files from a folder - no git repository needed.
# The default path is relative to the folder where the server starts, so start it from this folder
# (./mvnw spring-boot:run, the start-all script, or the IDE with this folder as the working directory).
# To use another folder, give an absolute path:  CONFIG_REPO=file:/path/to/config-files
spring.profiles.active=native
spring.cloud.config.server.native.search-locations=${CONFIG_REPO:file:../git-local-config-repo}
