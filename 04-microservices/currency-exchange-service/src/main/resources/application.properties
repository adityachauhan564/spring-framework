spring.application.name=currency-exchange
server.port=8000

# the config server is optional: the service still starts without it
spring.config.import=optional:configserver:http://localhost:8888

# register with Eureka (naming-server) under the name "currency-exchange", so others can find it
eureka.client.serviceUrl.defaultZone=http://localhost:8761/eureka
eureka.instance.prefer-ip-address=true

# in-memory H2. data.sql fills the table AFTER Hibernate has created it
spring.datasource.url=jdbc:h2:mem:testdb
spring.jpa.defer-datasource-initialization=true
spring.h2.console.enabled=true

# Resilience4j (see CircuitBreakerController)
resilience4j.retry.instances.sample-api.max-attempts=5
resilience4j.retry.instances.sample-api.wait-duration=500ms
resilience4j.retry.instances.sample-api.enable-exponential-backoff=true
# circuit breaker: look at the last 10 calls; open when half of them fail; stay open for 10 seconds
resilience4j.circuitbreaker.instances.default.sliding-window-size=10
resilience4j.circuitbreaker.instances.default.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.default.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.default.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.default.register-health-indicator=true
# rate limiter: allow only 2 calls every 10 seconds
resilience4j.ratelimiter.instances.default.limit-for-period=2
resilience4j.ratelimiter.instances.default.limit-refresh-period=10s
resilience4j.ratelimiter.instances.default.timeout-duration=0

# tracing: record every request (1.0 = 100%. In production you usually record only some, e.g. 0.1 = 10%)
management.tracing.sampling.probability=1.0
management.endpoints.web.exposure.include=health,info,circuitbreakers,retries,ratelimiters
