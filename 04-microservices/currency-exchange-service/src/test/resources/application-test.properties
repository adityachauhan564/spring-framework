# Settings used only in tests, switched on by @ActiveProfiles("test").
# Named application-TEST.properties on purpose: a src/test/resources/application.properties would
# REPLACE the main file in tests (not add to it), and silently lose all its settings.
# Tests must not need a running naming-server or config server.
eureka.client.enabled=false
spring.cloud.config.enabled=false
spring.config.import=
# make the retry demo quick in tests
resilience4j.retry.instances.sample-api.wait-duration=10ms
resilience4j.retry.instances.sample-api.enable-exponential-backoff=false
