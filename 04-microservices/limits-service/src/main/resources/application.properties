spring.application.name=limit-service-microservices
server.port=8080

# At startup, ask the config server for the "limit-service-microservices" settings.
# optional: = still start (using the local values below) even if the server is down.
spring.config.import=optional:configserver:http://localhost:8888

# The active profile picks the file limit-service-microservices-<profile>.properties on the server.
# To change it without editing this file:  --spring.profiles.active=qa
spring.profiles.active=dev

# Local backup values, used only when the config server cannot be reached.
limits-service.minimum=3
limits-service.maximum=997

# POST /actuator/refresh reads the config server again, without a restart.
management.endpoints.web.exposure.include=health,info,refresh
