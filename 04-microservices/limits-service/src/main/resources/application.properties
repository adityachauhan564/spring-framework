spring.application.name=limit-service-microservices
server.port=8080

# Ask the config server for "limit-service-microservices" config at startup.
# optional: = keep starting (with the local values below) if the server is down.
spring.config.import=optional:configserver:http://localhost:8888

# The active profile picks limit-service-microservices-<profile>.properties on the server.
# Change it without editing this file:  --spring.profiles.active=qa
spring.profiles.active=dev

# Local fallback values, used only when the config server can't be reached.
limits-service.minimum=3
limits-service.maximum=997

# POST /actuator/refresh re-reads the config server without a restart.
management.endpoints.web.exposure.include=health,info,refresh
