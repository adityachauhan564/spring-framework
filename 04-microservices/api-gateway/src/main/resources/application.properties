spring.application.name=api-gateway
server.port=8765

# the gateway finds the address for lb://NAME routes by asking Eureka
eureka.client.serviceUrl.defaultZone=http://localhost:8761/eureka
eureka.instance.prefer-ip-address=true

# Another option instead of the Java routes in ApiGatewayConfiguration: one automatic route for every
# service registered in Eureka, e.g. /currency-exchange/currency-exchange/from/USD/to/INR
#spring.cloud.gateway.server.webflux.discovery.locator.enabled=true
#spring.cloud.gateway.server.webflux.discovery.locator.lower-case-service-id=true

# tracing: the gateway starts the trace for every request it passes on
management.tracing.sampling.probability=1.0
# the gateway is reactive (WebFlux): without this, log lines written inside reactive code
# (like LoggingFilter) don't show the traceId, even though it is still passed on to the services
spring.reactor.context-propagation=auto
