spring.application.name=api-gateway
server.port=8765

# the gateway resolves lb://NAME routes through Eureka
eureka.client.serviceUrl.defaultZone=http://localhost:8761/eureka
eureka.instance.prefer-ip-address=true

# Alternative to the Java routes in ApiGatewayConfiguration: one automatic route per service
# registered in Eureka, e.g. /currency-exchange/currency-exchange/from/USD/to/INR
#spring.cloud.gateway.server.webflux.discovery.locator.enabled=true
#spring.cloud.gateway.server.webflux.discovery.locator.lower-case-service-id=true

# tracing: the gateway starts the trace for every request it forwards
management.tracing.sampling.probability=1.0
# the gateway is reactive (WebFlux): without this, log lines written inside reactive code
# (like LoggingFilter) don't get the traceId, even though it is still passed to the services
spring.reactor.context-propagation=auto
