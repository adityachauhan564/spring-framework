// A plain Java console application: no Spring, just the "application" plugin (./gradlew run).
plugins {
    id 'application'
}

repositories {
    mavenCentral()
}

dependencies {
    implementation libs.jackson.databind       // JSON files <-> Java objects
    implementation libs.jackson.jsr310         // LocalDate in JSON
    implementation libs.jbcrypt                // password hashing

    testImplementation platform(libs.junit.bom)
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

application {
    mainClass = 'com.learning.irctc.App'
}

// The console menu reads the keyboard: pass the terminal's input through to the app
tasks.named('run') {
    standardInput = System.in
}

tasks.named('test') {
    useJUnitPlatform()
}
