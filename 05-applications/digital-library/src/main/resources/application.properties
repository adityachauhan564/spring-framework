spring.application.name=digital-library
server.servlet.context-path=/digitalLibrary/api

# Default: in-memory H2 - nothing to install, and fresh data on every start (sample data from data.sql).
# Other profiles:  mysql (a real database)   redis (Redis as the cache + the /v1/redis playground)
#   ./gradlew bootRun --args='--spring.profiles.active=mysql,redis'
spring.datasource.url=jdbc:h2:mem:library
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.defer-datasource-initialization=true
spring.jpa.open-in-view=false

# The cache behind @Cacheable: a ConcurrentHashMap in memory, unless the redis profile changes it to Redis
spring.cache.type=simple

# Turn this on to see every SQL statement that Hibernate runs
spring.jpa.show-sql=false
