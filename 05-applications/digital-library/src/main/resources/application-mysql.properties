# Active only with the "mysql" profile. Needs a MySQL server; the database is created if missing.
# Credentials come from environment variables - never commit real passwords.
spring.datasource.url=jdbc:mysql://localhost:3306/digital_library?createDatabaseIfNotExist=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}

# keep the data between restarts, and don't re-insert the sample data each time
spring.jpa.hibernate.ddl-auto=update
spring.sql.init.mode=never
