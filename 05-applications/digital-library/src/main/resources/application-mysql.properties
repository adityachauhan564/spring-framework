# Active only with the "mysql" profile. Needs a running MySQL server; the database is created if it is missing.
# The username and password come from environment variables - never commit real passwords.
spring.datasource.url=jdbc:mysql://localhost:3306/digital_library?createDatabaseIfNotExist=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}

# keep the data between restarts, and don't add the sample data again every time
spring.jpa.hibernate.ddl-auto=update
spring.sql.init.mode=never
