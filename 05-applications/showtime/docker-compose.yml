# Optional services for the "kafka" and "mail" profiles:  docker compose up -d   (stop: docker compose down)
services:
  # Kafka in KRaft mode: one container. The course also ran ZooKeeper; KRaft replaced it (Kafka 4 removed it)
  kafka:
    image: apache/kafka:3.9.1
    container_name: showtime-kafka
    ports:
      - "9092:9092"

  # A fake mail server: accepts every email and shows it in a web inbox at http://localhost:8025
  mailpit:
    image: axllent/mailpit:v1.27
    container_name: showtime-mailpit
    ports:
      - "1025:1025"
      - "8025:8025"
