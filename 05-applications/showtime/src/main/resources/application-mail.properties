# Active only with the "mail" profile: emails go to Mailpit (docker compose up -d).
# Mailpit accepts every email and shows it at http://localhost:8025 - nothing is really delivered.
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
# For a real SMTP server (e.g. Gmail with an app password) also set:
#   spring.mail.username=${MAIL_USERNAME}  spring.mail.password=${MAIL_PASSWORD}
#   spring.mail.properties.mail.smtp.auth=true  spring.mail.properties.mail.smtp.starttls.enable=true
