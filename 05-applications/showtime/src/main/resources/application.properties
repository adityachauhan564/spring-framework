spring.application.name=showtime

# Default: in-memory H2 - nothing to install, sample data on every start (DataSeeder).
# Optional profiles (combine them with commas):
#   mysql  a real database                      kafka  notifications through Kafka
#   mail   real emails, caught by Mailpit       (Kafka + Mailpit: docker compose up -d)
spring.datasource.url=jdbc:h2:mem:showtime
spring.jpa.hibernate.ddl-auto=create-drop

# Close the database session when the service returns, instead of at the end of the HTTP request.
# Services then read everything they need inside their @Transactional methods.
spring.jpa.open-in-view=false

# Password of the seeded admin@showtime.local account (local demo only)
showtime.seed.admin-password=${ADMIN_PASSWORD:admin12345}

logging.level.com.gfg.showtime=debug
# Turn on to see every SQL statement Hibernate runs
spring.jpa.show-sql=false
