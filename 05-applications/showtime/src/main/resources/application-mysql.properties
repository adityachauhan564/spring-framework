# Active only with the "mysql" profile. Needs a MySQL server; the database is created if missing.
# Credentials come from environment variables - never commit real passwords.
spring.datasource.url=jdbc:mysql://localhost:3306/showtime?createDatabaseIfNotExist=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}

# keep the data between restarts (DataSeeder only fills an empty database)
spring.jpa.hibernate.ddl-auto=update
