# Active only with the "mysql" profile. Needs a running MySQL server; the database is created if it is missing.
# The username and password come from environment variables - never commit real passwords.
spring.datasource.url=jdbc:mysql://localhost:3306/showtime?createDatabaseIfNotExist=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}

# keep the data between restarts (DataSeeder fills the database only when it is empty)
spring.jpa.hibernate.ddl-auto=update
