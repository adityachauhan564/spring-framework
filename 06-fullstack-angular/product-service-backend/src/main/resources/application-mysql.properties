# Active only with the "mysql" profile:  ./mvnw spring-boot:run -Dspring-boot.run.profiles=mysql
# The database is created if it is missing. The username and password come from environment variables - never commit real passwords.
spring.datasource.url=jdbc:mysql://localhost:3306/spring_angular_bootcamp?createDatabaseIfNotExist=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}

# keep the data between restarts, and don't add the sample products again every time
spring.jpa.hibernate.ddl-auto=update
spring.sql.init.mode=never
