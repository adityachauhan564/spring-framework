spring.application.name=product-service

# Default: in-memory H2 - nothing to install, and fresh sample products from data.sql on every start.
# For MySQL, run with the "mysql" profile (application-mysql.properties).
spring.datasource.url=jdbc:h2:mem:products
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.defer-datasource-initialization=true

# The Angular dev server. Separate several origins with commas, or override it: APP_CORS_ALLOWED_ORIGINS=...
app.cors.allowed-origins=http://localhost:4200
