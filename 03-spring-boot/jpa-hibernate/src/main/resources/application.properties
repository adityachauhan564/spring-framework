spring.application.name=learn-jpa-and-hibernate

# In-memory H2 with a FIXED name, so the H2 console URL is predictable:
#   http://localhost:8080/h2-console  ->  JDBC URL jdbc:h2:mem:testdb, user sa, empty password
spring.datasource.url=jdbc:h2:mem:testdb
spring.h2.console.enabled=true

# schema.sql owns the table definitions; Hibernate must not create or change tables itself.
# (Try "create-drop" or "update" instead and delete schema.sql - Hibernate then builds the
# table from the @Entity. Real projects use "validate" plus a migration tool like Flyway.)
spring.jpa.hibernate.ddl-auto=none

# print the SQL Hibernate generates (topics 02-04), nicely formatted
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
