spring.application.name=rest-first-books-api

# Default: in-memory H2 - nothing to install, and fresh data on every start.
# For MySQL, run with the "mysql" profile (see application-mysql.properties).
spring.datasource.url=jdbc:h2:mem:books

# Hibernate creates the tables from the @Entity classes, then data.sql adds sample books.
# defer-datasource-initialization makes data.sql wait, and run only AFTER Hibernate has created the tables.
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.defer-datasource-initialization=true
