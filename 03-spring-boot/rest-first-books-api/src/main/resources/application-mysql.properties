# Active only with the "mysql" profile:
#   ./mvnw spring-boot:run -Dspring-boot.run.profiles=mysql
# Needs a running MySQL server. The database is created if it doesn't exist yet.
# The username and password come from environment variables - never commit real passwords.
spring.datasource.url=jdbc:mysql://localhost:3306/youtube_springboot_api?createDatabaseIfNotExist=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}

# keep the data between restarts, and don't add the sample books again every time
spring.jpa.hibernate.ddl-auto=update
spring.sql.init.mode=never
