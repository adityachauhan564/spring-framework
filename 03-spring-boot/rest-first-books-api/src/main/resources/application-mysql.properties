# Active only with the "mysql" profile:
#   ./mvnw spring-boot:run -Dspring-boot.run.profiles=mysql
# Needs a MySQL server; the database is created if it doesn't exist.
# Credentials come from environment variables - never commit real passwords.
spring.datasource.url=jdbc:mysql://localhost:3306/youtube_springboot_api?createDatabaseIfNotExist=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}

# keep the data between restarts; don't re-insert the sample books each time
spring.jpa.hibernate.ddl-auto=update
spring.sql.init.mode=never
